# =============================================================================
# FedRGBD — Complete Experiment Matrix
# =============================================================================
# Total runs: ~90 (excluding profiling which runs in parallel)
# Hardware: 3× Jetson Orin Nano Super, wired Gigabit Ethernet, D435if + D435i + ZED 2i
#           (the v1 experiments of the original submission ran over WiFi 802.11ac)
# =============================================================================

experiment_1:
  name: "FL Strategy Comparison"
  description: "Compare 6 strategies × 2 data distributions × 3 seeds"
  total_runs: 36

  strategies:
    - centralized
    - local_only
    - fedavg
    - fedprox_0.01
    - fedprox_0.1
    - fedbn

  data_distributions:
    iid:
      description: "Random equal split across 3 nodes (~16K per node)"
      fire_ratio_per_node: 0.628

    non_iid_label:
      description: "Label skew across 3 nodes"
      node_a_fire_ratio: 0.80
      node_b_fire_ratio: 0.885
      node_c_fire_ratio: 0.20

  modality: "rgb"
  seeds: [42, 123, 456]
  rounds: 3
  local_epochs: 5
  batch_size: 8

experiment_2:
  name: "Modality Ablation"
  description: "5 modality combos × best FL strategy × 3 seeds"
  total_runs: 15

  strategy: "fedprox_0.01"  # Best from Exp 1
  data_distribution: "non_iid_label"

  modalities:
    - name: "rgb"
      channels: 3
    - name: "depth"
      channels: 1
    - name: "ir"
      channels: 1
    - name: "rgb_d"
      channels: 4
    - name: "rgb_d_ir"
      channels: 5

  seeds: [42, 123, 456]

experiment_3:
  name: "Cross-Sensor Generalization"
  description: "Train/test across heterogeneous cameras (3 levels)"
  total_runs: 27  # 9 configs × 3 seeds

  configurations:
    # Level 1: Manufacturing Variance
    - name: "d435if_to_d435i"
      train: "node_a"
      test: "node_b"
      heterogeneity: "manufacturing_variance"

    - name: "d435i_to_d435if"
      train: "node_b"
      test: "node_a"
      heterogeneity: "manufacturing_variance"

    # Level 2: Cross-Technology
    - name: "realsense_a_to_zed"
      train: "node_a"
      test: "node_c"
      heterogeneity: "cross_technology"

    - name: "zed_to_realsense_a"
      train: "node_c"
      test: "node_a"
      heterogeneity: "cross_technology"

    - name: "realsense_b_to_zed"
      train: "node_b"
      test: "node_c"
      heterogeneity: "cross_technology"

    - name: "zed_to_realsense_b"
      train: "node_c"
      test: "node_b"
      heterogeneity: "cross_technology"

    # Level 3: FL Generalization
    - name: "fl_all_to_node_a"
      train: "fl_all"
      test: "node_a"
      heterogeneity: "fl_generalization"

    - name: "fl_all_to_node_b"
      train: "fl_all"
      test: "node_b"
      heterogeneity: "fl_generalization"

    - name: "fl_all_to_node_c"
      train: "fl_all"
      test: "node_c"
      heterogeneity: "fl_generalization"

  modality: "rgb_d"
  seeds: [42, 123, 456]

experiment_4:
  name: "Resource Profiling"
  description: "Per-round energy, latency, communication metrics"
  total_runs: 0  # Runs alongside Experiment 1

  metrics:
    - gpu_power_w
    - board_power_w
    - training_time_s
    - model_transfer_size_kb
    - transfer_latency_ms
    - total_energy_wh
    - total_communication_mb
    - peak_gpu_memory_mb

  profiling_tool: "tegrastats"
  sampling_interval_ms: 100

experiment_5:
  name: "Network Constraint Sensitivity"
  description: "Best FL strategy under bandwidth limitations"
  total_runs: 12  # 4 conditions × 3 seeds

  strategy: "fedprox_0.01"  # Best from Exp 1

  network_conditions:
    - name: "wired_baseline"   # unthrottled wired GbE (was "wifi_baseline" in v1)
      bandwidth: "unrestricted"
      packet_loss: 0.0

    - name: "10mbps"
      bandwidth: "10mbps"
      packet_loss: 0.0
      tc_command: "sudo tc qdisc add dev {iface} root tbf rate 10mbit burst 32kbit latency 400ms"

    - name: "1mbps"
      bandwidth: "1mbps"
      packet_loss: 0.0
      tc_command: "sudo tc qdisc add dev {iface} root tbf rate 1mbit burst 32kbit latency 400ms"

    - name: "1mbps_lossy"
      bandwidth: "1mbps"
      packet_loss: 0.05
      tc_command: "sudo tc qdisc add dev {iface} root handle 1: netem loss 5% && sudo tc qdisc add dev {iface} parent 1:1 handle 10: tbf rate 1mbit burst 32kbit latency 400ms"

  seeds: [42, 123, 456]

# =============================================================================
# NCAA MAJOR-REVISION EXPERIMENT MATRIX
# =============================================================================
# Added for the NCAA revision round (see docs/ for the reviewer response).
# Consumed by scripts/print_revision_commands.py, which expands every block
# below into concrete `src/fl/server.py` / `src/fl/client.py` (or
# `scripts/train_centralized.py` / `scripts/train_local.py`) command lines.
#
# Output-directory convention (parsed by scripts/analyze_results.py):
#   results/rev_<dist>_<strategy>[_ep<E>][_lr<LR>][_r<R>]_seed<S>
#   - the optional _ep<E> / _lr<LR> / _r<R> suffixes are only appended when
#     that value differs from the block default (local_epochs=5, lr=0.001,
#     rounds=3) -- this means the "default" cell of a sweep block (e.g. E=5 in
#     `local_epochs`, lr=0.001 in `learning_rate`, mu=0.01 in `mu_grid`) lands
#     in the SAME results/ directory as the equivalent cell in another block
#     (e.g. `seed_extension`), so results are naturally shared/deduplicated by
#     scripts/print_revision_commands.py's --skip_existing (on by default).
#   - <dist> in {iid, noniid, dirichlet0.1, dirichlet0.5, dirichlet1,
#     iid_sub0.05, iid_sub0.01, noniid_sub0.05, noniid_sub0.01}, corresponding
#     to the data/processed/<split>/<node> splits produced by
#     src/data/data_splitter.py (iid, non_iid_label, dirichlet_<alpha>,
#     <split>_sub<frac>).
#   - <strategy> is the exact `--strategy` value passed to src/fl/server.py
#     (fedavg, fedprox_<mu>, fedbn) or `centralized` / `local` for the
#     baseline scripts.
#
# Server CLI:
#   python3 src/fl/server.py --strategy <strategy> --rounds <R> --seed <S> \
#       --min_clients 3 --output_dir results/<run> --tag <dist>
#   (--tag is a new server.py CLI arg added for this revision so the server
#   records which distribution/config a run belongs to independent of the
#   output directory name.)
# Client CLI (run once per node, same --seed on every node):
#   python3 src/fl/client.py --server 192.168.1.10:8080 \
#       --data_dir data/processed/<split>/<node> --batch_size 8 --seed <S> \
#       --local_epochs <E> --lr <LR>
#
# TIME BUDGET: each FL run (1 server + 3 client processes) takes roughly
# 90-170 minutes wall clock on the 3x Jetson Orin Nano Super testbed (per the
# README hardware/known-issues notes) -- no more precise per-run timing is
# available, so use this range only when estimating how long the ~151
# actionable runs below (see `grand_total_runs` / `grand_total_new_runs`)
# will take on a single 3-node testbed.
# =============================================================================

revision:
  meta:
    description: >
      NCAA major-revision experiment matrix. Extends experiment_1's 3-seed
      FedAvg/FedProx/FedBN x {iid, non_iid_label} comparison with a 5-seed
      extension, a Dirichlet label-skew sweep, a low-data (client subsample)
      sweep, a longer FL horizon for FedBN, a FedProx mu sensitivity grid,
      a local-epoch sweep, a learning-rate sweep, and matching
      centralized/local-only baselines for every new split/seed introduced
      here.
    output_dir_convention: "results/rev_<dist>_<strategy>[_ep<E>][_lr<LR>][_r<R>]_seed<S>"
    dist_tags: [iid, noniid, dirichlet0.1, dirichlet0.5, dirichlet1,
                iid_sub0.05, iid_sub0.01, noniid_sub0.05, noniid_sub0.01]
    node_ips:
      node_a: {ip: "192.168.1.10", role: "server + client"}
      node_b: {ip: "192.168.1.7", role: "client"}
      node_c: {ip: "192.168.1.6", role: "client"}
    time_budget_note: >
      ~90-170 minutes per FL run on the 3-Jetson testbed (see block comment
      above); no precise per-run timing beyond that range is available.

  # ------------------------------------------------------------------------
  # 1. Seed-count extension: 3 -> 5 seeds for the headline FedAvg/FedProx
  #    comparison from experiment_1.
  # ------------------------------------------------------------------------
  seed_extension:
    description: >
      FedAvg vs FedProx(mu=0.01) x {iid, non_iid_label} x 5 seeds, extending
      experiment_1's 3-seed runs for tighter confidence intervals.
    strategies: [fedavg, fedprox_0.01]
    data_distributions: [iid, non_iid_label]
    seeds: [42, 123, 456, 789, 1011]
    # Seeds 42/123/456 already exist as results/3node_<dist>_<strategy>_seed<seed>/
    # from experiment_1 (see experiment_1 above) and are reused as-is for the
    # combined 5-seed analysis -- only 789 and 1011 need fresh FL runs under
    # the results/rev_... naming convention used by this revision matrix.
    new_seeds: [789, 1011]
    # IMPORTANT: reusing the old seeds is only valid while data/processed is the
    # ORIGINAL image-level partition.  If the data is re-split (e.g. with
    # --group_file for the leakage-safe protocol, which changes the partition),
    # all 5 seeds must be rerun: `print_revision_commands.py --all_seeds`
    # (or set `all_seeds: true` here).
    all_seeds: false
    rounds: 3
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 20   # full logical grid: 2 strategies x 2 dists x 5 seeds
    new_runs: 8      # 2 strategies x 2 dists x 2 new seeds (what print_revision_commands.py emits)

  # ------------------------------------------------------------------------
  # 2. Dirichlet label-skew sweep.
  # ------------------------------------------------------------------------
  dirichlet_skew:
    description: >
      Label-skew sensitivity via Dirichlet(alpha) client partitioning, at
      three concentration levels (lower alpha = more skewed).
    alphas: [0.1, 0.5, 1.0]
    strategies: [fedavg, fedprox_0.01]
    seeds: [42, 123, 456]
    rounds: 3
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 18   # 3 alphas x 2 strategies x 3 seeds

  # ------------------------------------------------------------------------
  # 3. Low-data (client subsample) sweep.
  # ------------------------------------------------------------------------
  low_data:
    description: >
      Effect of severe per-client data scarcity via the subsampled
      <split>_sub<frac> splits, at {iid, non_iid_label} x {5%, 1%} of data.
    fractions: [0.05, 0.01]
    data_distributions: [iid, non_iid_label]
    strategies: [fedavg, fedprox_0.01]
    # Seeds 789 and 1011 were added on 2026-09-27, after the 3-seed block had run,
    # because three seeds could not separate the strategies. They run in the SAME
    # (heterogeneous) power configuration and the same results/rev_* namespace as
    # the first three, so all five seeds pool; they ran before any mode change.
    seeds: [42, 123, 456, 789, 1011]
    rounds: 3
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 40   # 2 fractions x 2 dists x 2 strategies x 5 seeds

  # ------------------------------------------------------------------------
  # 4. Longer FL horizon for FedBN (+ FedAvg reference).
  # ------------------------------------------------------------------------
  long_horizon_fedbn:
    description: >
      FedBN under a longer 10-round horizon (vs. the 3-round default) on the
      non_iid_label split, with FedAvg at the same horizon as a reference.
    strategies: [fedbn, fedavg]
    data_distributions: [non_iid_label]
    seeds: [42, 123, 456]
    rounds: 10
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 6    # 2 strategies x 3 seeds

  # ------------------------------------------------------------------------
  # 4b. Ten rounds with every node at MAXN_SUPER (added 2026-09-27).
  #     Declares its power configuration: its runs always live in
  #     results/pc_maxn/ and print_revision_commands.py refuses to emit them
  #     for any other configuration, so they can never be skipped as "done"
  #     because of, or pooled with, a heterogeneous-configuration run.
  # ------------------------------------------------------------------------
  maxn_long_horizon:
    description: >
      FedAvg, FedProx(mu=0.01) and FedBN x {iid, non_iid_label} x 5 seeds,
      10 rounds, all three nodes at MAXN_SUPER.
    power_config: maxn
    strategies: [fedavg, fedprox_0.01, fedbn]
    data_distributions: [iid, non_iid_label]
    seeds: [42, 123, 456, 789, 1011]
    rounds: 10
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 30   # 3 strategies x 2 dists x 5 seeds
    # Gate (replaced 2026-09-28, docs/CROSS_CONFIG_COMPARISON.md). The former
    # cross-configuration identity gates (rounds 1-3 bitwise identical to the
    # heterogeneous matrix) cannot pass: node_c ran the matrix at 7W, which
    # power-gates half of the GPU's TPCs and takes two CPU cores offline; its local
    # training differs bitwise from MAXN_SUPER (measured, analysis/determinism/).
    # Hard gate now: the two MAXN smoke runs below must be bitwise identical;
    # scripts/run_matrix.py checks them before the block starts and refuses
    # otherwise. The comparison with the heterogeneous matrix is a declared
    # analysis (scripts/cross_config_comparison.py), never a gate.
    determinism_gate:
      runs: [results/diag_smoke_maxn, results/diag_smoke_maxn_r2]

  # ------------------------------------------------------------------------
  # A5. Additional Dirichlet partition draws on the testbed (pre-registered
  #     2026-10-07, docs/A5_DIRICHLET_DRAWS_PREREG.md, commit 1cdbd4e).
  #     alpha = 0.1 only; the two new draws (partition seeds 123, 456; splits
  #     dirichlet_0.1_ps<seed>) x {FedAvg, FedProx(0.01)}; one training seed;
  #     as maxn_long_horizon otherwise, with its determinism gate. Order:
  #     FedAvg before FedProx, ps123 before ps456. Emitted only with --block.
  #     Descriptive only; never pooled with the main Dirichlet results.
  # ------------------------------------------------------------------------
  a5_dirichlet_draws:
    description: >
      FedAvg and FedProx(mu=0.01) on the two additional Dirichlet draws of
      alpha = 0.1 (partition seeds 123, 456), 10 rounds, all nodes MAXN_SUPER.
    power_config: maxn
    strategies: [fedavg, fedprox_0.01]
    alphas: [0.1]
    partition_seeds: [123, 456]
    seeds: [42]
    rounds: 10
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 4    # 2 strategies x 2 draws x 1 seed
    determinism_gate:
      runs: [results/diag_smoke_maxn, results/diag_smoke_maxn_r2]

  # ------------------------------------------------------------------------
  # 5. FedProx proximal-mu sensitivity grid.
  # ------------------------------------------------------------------------
  mu_grid:
    description: "FedProx proximal-mu sensitivity sweep on non_iid_label."
    mus: [0.001, 0.01, 0.05, 0.1, 0.5]
    data_distributions: [non_iid_label]
    seeds: [42, 123, 456]
    rounds: 3
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    total_runs: 15   # 5 mus x 3 seeds
    note: >
      The mu=0.01 cells reproduce the same (strategy, dist, seed) config as
      seed_extension's fedprox_0.01/non_iid_label seeds 42/123/456 and land
      in the same results/rev_noniid_fedprox_0.01_seed<S> directory, so they
      are naturally deduplicated by --skip_existing.

  # ------------------------------------------------------------------------
  # 6. Local-epoch (client compute budget) sensitivity.
  # ------------------------------------------------------------------------
  local_epochs:
    description: "Local-epoch sensitivity on non_iid_label."
    local_epochs_values: [1, 2, 5]
    strategies: [fedavg, fedprox_0.01]
    data_distributions: [non_iid_label]
    seeds: [42, 123, 456]
    rounds: 3
    lr: 0.001
    batch_size: 8
    total_runs: 18   # 3 E values x 2 strategies x 3 seeds
    note: >
      E=5 is the block default, so those cells share their
      results/rev_noniid_<strategy>_seed<S> directory with seed_extension
      and mu_grid instead of getting an _ep5 suffix.

  # ------------------------------------------------------------------------
  # 7. Client learning-rate sensitivity.
  # ------------------------------------------------------------------------
  learning_rate:
    description: "Client learning-rate sensitivity on non_iid_label."
    lrs: [0.0001, 0.001]
    strategies: [fedavg, fedprox_0.01]
    data_distributions: [non_iid_label]
    seeds: [42, 123, 456]
    rounds: 3
    local_epochs: 5
    batch_size: 8
    total_runs: 12   # 2 lrs x 2 strategies x 3 seeds
    note: >
      lr=0.001 is the block default, so those cells share their
      results/rev_noniid_<strategy>_seed<S> directory with seed_extension,
      mu_grid and local_epochs instead of getting an _lr0.001 suffix.

  # ------------------------------------------------------------------------
  # 8. Centralized / local-only baseline extension.
  # ------------------------------------------------------------------------
  baselines_extension:
    description: >
      Centralized (upper bound, scripts/train_centralized.py) and local-only
      (lower bound, scripts/train_local.py --batch --cross_eval) baselines
      for the new seeds and new splits introduced above. epochs = rounds x
      local_epochs (3 x 5 = 15), matching the FL runs' total local compute.
    baseline_types: [centralized, local_only]
    rounds: 3
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    parts:
      new_seeds:
        description: >
          Seeds 789, 1011 on the iid / non_iid_label splits.  After the leakage-safe
          re-split (--group_file) the old-seed baselines are not comparable either:
          --all_seeds emits all five seeds (all_seeds list below), 20 runs.
        data_distributions: [iid, non_iid_label]
        seeds: [789, 1011]
        all_seeds: [42, 123, 456, 789, 1011]
        total_runs: 8    # 2 baseline types x 2 dists x 2 seeds (20 with --all_seeds)
      dirichlet:
        description: "3 seeds on each dirichlet_<alpha> split."
        alphas: [0.1, 0.5, 1.0]
        seeds: [42, 123, 456]
        total_runs: 18   # 2 baseline types x 3 alphas x 3 seeds
      subsample:
        description: "3 seeds on each subsampled split."
        data_distributions: [iid, non_iid_label]
        fractions: [0.05, 0.01]
        seeds: [42, 123, 456]
        total_runs: 24   # 2 baseline types x 2 dists x 2 fractions x 3 seeds
    total_runs: 50       # sum of the three parts above

  # Sum of every block's `total_runs` (full logical grid, incl. reused seeds).
  grand_total_runs: 209   # 20 + 18 + 40 + 6 + 30 + 15 + 18 + 12 + 50
  # Sum of every block's actionable run count as emitted by
  # scripts/print_revision_commands.py (seed_extension counted as new_runs=8
  # instead of total_runs=20; directory-level overlaps across blocks noted
  # above are intentionally NOT subtracted here, they are handled at run time
  # by --skip_existing).
  grand_total_new_runs: 197   # 8 + 18 + 40 + 6 + 30 + 15 + 18 + 12 + 50

  data_preparation:
    description: >
      Regenerate data/processed with leakage-safe grouping and the new
      dirichlet/subsample splits required by the blocks above. Run once,
      after scripts/analyze_flame_leakage.py has produced
      analysis/leakage/groups.json. --clean is mandatory because this
      re-splits an existing data/processed (without it the files of the
      previous partition stay behind and leak train images into val/test);
      --verify re-reads the manifests afterwards and exits non-zero if any
      near-duplicate group spans nodes or train/val/test.
    commands:
      - "python3 src/data/data_splitter.py --data_dir data/raw/flame_dataset --output_dir data/processed --nodes 3 --seed 42 --group_file analysis/leakage/groups.json --dirichlet_alpha 0.1 0.5 1.0 --subsample_frac 0.05 0.01 --clean --verify"

  analysis:
    description: "Run after the revision matrix (or any subset of it) completes."
    commands:
      - "python3 scripts/analyze_results.py --results_dir results --output_dir analysis"
      - "python3 scripts/analyze_flame_leakage.py --data_dir data/raw/flame_dataset --processed_dir data/processed --output_dir analysis/leakage"

  # ------------------------------------------------------------------------
  # 9. Scene-independent (leave-one-scene-out) cross-sensor evaluation.
  #    Added for Reviewer 3: the original experiment_3 cross-camera runs split
  #    frames of the SAME five scenes between train and test, so scene
  #    similarity can inflate the reported cross-camera accuracy.  This block
  #    is consumed by scripts/cross_sensor_loso.py (NOT by
  #    scripts/print_revision_commands.py, whose BLOCK_ORDER covers the FLAME
  #    FL runs only), which trains on the other scenes and evaluates on the
  #    held-out scene, and -- with --pooled_random_split -- re-runs the old
  #    frame-level random split on exactly the same frames so the paper can
  #    report random-split vs LOSO side by side.
  # ------------------------------------------------------------------------
  cross_sensor_loso:
    description: >
      Leave-one-scene-out evaluation on the custom RGB-D captures
      (data/raw/custom/node_{a,b,c}).  One fold per scene: train on the
      remaining scenes of the train nodes, evaluate on the held-out scene of
      the test nodes (cross-camera) and of the train nodes (same-camera).
      Reported as the full metric set per fold plus mean +/- std over folds.
    script: "scripts/cross_sensor_loso.py"
    data_dir: "data/raw/custom"
    protocol: "leave_one_scene_out"
    scene_source: >
      "scene"/"label" keys inside each {id}_meta.json, else a labels.csv with
      columns id,scene,label passed via --labels_csv, else a <scene>_<label>_<n>
      frame-id pattern.  Never inferred implicitly (src/data/custom_dataset.py
      raises if no source annotates every frame).
    modality: "rgb_d"
    modalities: [rgb, depth, ir, rgb_d, rgb_d_ir]
    epochs: 15          # = experiment_1's rounds x local_epochs (3 x 5)
    batch_size: 8
    lr: 0.001
    img_size: 224
    max_depth_m: 10
    seeds: [42, 123, 456]
    pooled_random_split: true   # old (leaky) frame-level split, same data
    test_frac: 0.2              # test fraction of that baseline
    output_dir_convention: "results/loso_<config>_<modality>_seed<S>"
    configurations:
      # Level 1: manufacturing variance (D435if <-> D435i)
      - name: "a_to_b"
        train_nodes: [node_a]
        test_nodes: [node_b]
        heterogeneity: "manufacturing_variance"
      - name: "b_to_a"
        train_nodes: [node_b]
        test_nodes: [node_a]
        heterogeneity: "manufacturing_variance"
      # Level 2: cross-technology (RealSense <-> ZED); rgb_d only, the ZED
      # node has no IR stream
      - name: "a_to_c"
        train_nodes: [node_a]
        test_nodes: [node_c]
        heterogeneity: "cross_technology"
      - name: "c_to_a"
        train_nodes: [node_c]
        test_nodes: [node_a]
        heterogeneity: "cross_technology"
      - name: "ab_to_c"
        train_nodes: [node_a, node_b]
        test_nodes: [node_c]
        heterogeneity: "cross_technology"
      # Level 3: same-camera control (scene-independent, no sensor shift)
      - name: "a_same"
        train_nodes: [node_a]
        same_node: true
        heterogeneity: "same_camera_control"
      - name: "b_same"
        train_nodes: [node_b]
        same_node: true
        heterogeneity: "same_camera_control"
      - name: "c_same"
        train_nodes: [node_c]
        same_node: true
        heterogeneity: "same_camera_control"
    total_runs: 24   # 8 configurations x 3 seeds
    note: >
      Each run internally trains one model per scene (5 folds on the paper's
      five-scene capture), so a run costs ~5x a single training; with
      --pooled_random_split one extra model is trained per run.
    commands:
      - "python3 scripts/cross_sensor_loso.py --data_dir data/raw/custom --train_nodes node_a --test_nodes node_b --modality rgb_d --epochs 15 --batch_size 8 --lr 1e-3 --seed 42 --pooled_random_split --output_dir results/loso_a_to_b_rgb_d_seed42"
      - "python3 scripts/cross_sensor_loso.py --data_dir data/raw/custom --train_nodes node_a node_b --test_nodes node_c --modality rgb_d --epochs 15 --batch_size 8 --lr 1e-3 --seed 42 --pooled_random_split --output_dir results/loso_ab_to_c_rgb_d_seed42"
      - "python3 scripts/cross_sensor_loso.py --data_dir data/raw/custom --train_nodes node_a --same_node --modality rgb_d_ir --epochs 15 --batch_size 8 --lr 1e-3 --seed 42 --output_dir results/loso_a_same_rgb_d_ir_seed42"

  # ------------------------------------------------------------------------
  # 10. Camera experiment, question (b): federated training with sensor-skewed
  #     clients (docs/CAMERA_EXPERIMENT_PREREG.md section 6, declared
  #     2026-09-28 before any footage existed).  node_a holds only D435if
  #     frames, node_b only D435i, node_c only ZED 2i.  Five scene folds
  #     (data/splits_camera/fl_folds.csv): test = fold f, validation =
  #     fold (f + 1) mod 5, training = the other three, the same scenes on
  #     every client; materialised by scripts/camera_fl_prepare.py into
  #     data/processed/camera_fold<f>/node_{a,b,c}.
  #     Declares its power configuration like maxn_long_horizon: all three
  #     nodes at MAXN_SUPER (pre-flight power-mode lock), never emitted for
  #     another configuration and never pooled with one.  Separate from FLAME
  #     by dataset: runs in results/camera/maxn/, desktop baselines in
  #     results/camera/desktop/; scripts/analyze_results.py never reads
  #     results/camera/.  Its own determinism gate (prereg sec. 6, amended
  #     2026-09-29 before any footage): the two smoke runs below, the same
  #     command twice (--block camera_determinism_smoke), must be bitwise
  #     identical before the block starts, as for maxn_long_horizon.
  #     Not in print_revision_commands.py's BLOCK_ORDER (not part of the FLAME
  #     matrix, not counted in grand_total_runs, like cross_sensor_loso):
  #     emitted only with --block camera_sensor_skew and --block
  #     camera_determinism_smoke (testbed, run_matrix.py) and --block
  #     camera_sensor_skew_baselines (desktop GPU, never run_matrix).
  #     Analysis: scripts/camera_analysis_b.py -> analysis/camera/b/.
  # ------------------------------------------------------------------------
  camera_sensor_skew:
    description: >
      FedAvg, FedProx(mu=0.01) and FedBN x 5 scene folds x 3 seeds, 10 rounds,
      5 local epochs, Adam 1e-3, batch 8, each client holding only its own
      sensor's RGB frames, all three nodes at MAXN_SUPER.
    prereg: "docs/CAMERA_EXPERIMENT_PREREG.md"
    power_config: maxn
    strategies: [fedavg, fedprox_0.01, fedbn]
    folds: [0, 1, 2, 3, 4]
    seeds: [42, 123, 456]
    rounds: 10
    local_epochs: 5
    lr: 0.001
    batch_size: 8
    modality: "rgb"
    output_dir_convention: "results/camera/maxn/rev_camera_fold<f>_<strategy>_r10_seed<S>"
    total_runs: 45   # 3 strategies x 5 folds x 3 seeds
    determinism_gate:
      runs: [results/camera/maxn/diag_camera_smoke, results/camera/maxn/diag_camera_smoke_r2]
      smoke: {fold: 0, strategy: fedavg, seed: 42, rounds: 2}
    data_preparation:   # on each node, its own sensor's frames only (prereg sec. 9)
      - "node_a: python3 scripts/camera_fl_prepare.py --clean --nodes node_a && python3 scripts/camera_fl_prepare.py --verify --nodes node_a"
      - "node_b: python3 scripts/camera_fl_prepare.py --clean --nodes node_b && python3 scripts/camera_fl_prepare.py --verify --nodes node_b"
      - "node_c: python3 scripts/camera_fl_prepare.py --clean --nodes node_c && python3 scripts/camera_fl_prepare.py --verify --nodes node_c"
    desktop_baselines:
      description: >
        Local-only (each client alone, scripts/train_local.py --batch) and
        centralized (the three clients' training data pooled,
        scripts/train_centralized.py), epochs = rounds x local_epochs
        (10 x 5 = 50), same optimiser, per fold and seed, desktop GPU, the
        declared selection rule; then scripts/predict_from_checkpoint.py
        <run> for the per-image predictions the analysis reads.
      baseline_types: [centralized, local_only]
      output_root: results/camera/desktop
      output_dir_convention: "results/camera/desktop/rev_camera_fold<f>_<centralized|local>_r10_seed<S>"
      total_runs: 30   # 2 types x 5 folds x 3 seeds (= 60 trainings: local-only trains one model per node)
